[project]
name = "pykrak"
version = "0.1.0"
description = "Python translation of Michael Porter's KRAKEN (not KRAKENC)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "array-api-compat>=1.12.0",
  "array-api-extra>=0.9.1",
  "numba>=0.61.2",
  "numpy>=2.2.6",
]

[dependency-groups]
dev = [
  "pre-commit>=4.2.0",
  "ruff>=0.12.5",
]
jax = [
    "jax>=0.6.2",
]
torch = [
    "torch",
]
test = [
  "pyat",
  "pytest>=9.0.1",
  "array-api-strict",
  "scipy>=1.15.3",
  "matplotlib>=3.10.3",
]

[tool.pytest]
addopts = [
  "--import-mode=importlib",
]
python_files = ["test_*.py"]

[tool.uv.sources]
pyat = { git = "https://github.com/hunterakins/pyat" }
